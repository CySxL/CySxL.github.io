<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CySxL's Repo</title>
<link rel="icon" href="repo/CydiaIcon.png">
<link rel="apple-touch-icon" href="repo/CydiaIcon.png">
<style>
:root {
	--bg: #f3f1ee; --card: #ffffff; --text: #24272b; --muted: #6f747b; --line: rgba(36, 39, 43, 0.08);
	--accent: #5d6f84; --accent-text: #ffffff; --glow1: #c9d3de; --glow2: #e4cfc9; --glow3: #d3ddd2;
	--pill: #eceae6; --rootless: #4f7a5b; --roothide: #7a5574;
	--kofi-bg: #d7e2d3; --kofi: #46664e; --reddit-bg: #f0dccf; --reddit: #a14d2a; --x-bg: #d6dee7; --x: #3f5267; --discord-bg: #e6dae3; --discord: #6b4865;
	--dot1: #8fa3b8; --dot2: #d3a296; --dot3: #98b79f; --grid: rgba(36, 39, 43, 0.05);
}
@media (prefers-color-scheme: dark) {
	:root {
		--bg: #121417; --card: #1c1f23; --text: #eceef0; --muted: #9aa0a7; --line: rgba(255, 255, 255, 0.07);
		--accent: #8fa3b8; --accent-text: #121417; --glow1: #26313d; --glow2: #3a2c2a; --glow3: #27332a;
		--pill: #262a2f; --rootless: #9cc0a5; --roothide: #c3a2bd;
		--kofi-bg: #26332a; --kofi: #a9c9b0; --reddit-bg: #3d2b22; --reddit: #efb08f; --x-bg: #25303b; --x: #aec1d4; --discord-bg: #33262f; --discord: #d4b6ce;
		--dot1: #5f7590; --dot2: #9a6c62; --dot3: #6c8f74; --grid: rgba(255, 255, 255, 0.04);
	}
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.45 -apple-system, BlinkMacSystemFont, sans-serif; -webkit-font-smoothing: antialiased; }
#field { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.hero { position: relative; overflow: hidden; padding: 56px 16px 36px; background: linear-gradient(var(--bg) calc(100% - 48px), transparent); }
.hero::before { content: ""; position: absolute; inset: -40% -10% auto; height: 140%;
	background: radial-gradient(40% 50% at 20% 30%, var(--glow1), transparent 70%),
		radial-gradient(35% 45% at 78% 22%, var(--glow2), transparent 70%),
		radial-gradient(40% 50% at 60% 82%, var(--glow3), transparent 70%); }
.hero > div { position: relative; max-width: 680px; margin: 0 auto; text-align: center; }
.hero img { width: 96px; height: 96px; border-radius: 22.5%; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.18); }
h1 { font-size: 34px; letter-spacing: -0.02em; margin: 18px 0 6px; }
.tagline { color: var(--muted); margin: 0 auto 22px; max-width: 460px; }
.add { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.add a { min-width: 150px; padding: 12px 18px; border-radius: 14px; background: var(--accent); color: var(--accent-text); text-decoration: none; font-weight: 600; }
.add a.ghost { background: var(--card); color: var(--text); box-shadow: inset 0 0 0 1px var(--line); }
.url { display: inline-block; margin-top: 16px; padding: 6px 12px; border-radius: 999px; background: var(--card); box-shadow: inset 0 0 0 1px var(--line);
	font: 13px ui-monospace, Menlo, monospace; color: var(--muted); cursor: pointer; }
main { position: relative; max-width: 680px; margin: 0 auto; padding: 8px 16px 32px; }
.head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 8px 4px 12px; }
.head h2 { font-size: 20px; margin: 0; }
.head span { color: var(--muted); font-size: 14px; }
ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
li { background: var(--card); border-radius: 16px; padding: 14px; display: flex; gap: 14px; align-items: flex-start; box-shadow: 0 1px 0 var(--line), 0 6px 18px rgba(0, 0, 0, 0.04); }
li img { width: 52px; height: 52px; border-radius: 22.5%; flex: none; }
li section { min-width: 0; flex: 1; }
.title { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.title b { font-size: 17px; font-weight: 600; }
.ver { font-size: 12px; color: var(--muted); background: var(--pill); padding: 2px 8px; border-radius: 999px; }
.desc { color: var(--muted); font-size: 14px; margin-top: 3px; }
.tags { display: flex; gap: 6px; margin-top: 8px; }
.tags i { font-style: normal; font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 999px; background: var(--pill); }
.tags i.rootless { color: var(--rootless); }
.tags i.roothide { color: var(--roothide); }
.tags i.ios { color: var(--muted); font-weight: 500; }
.new { font-size: 12px; font-weight: 600; color: var(--accent-text); background: var(--accent); padding: 2px 8px; border-radius: 999px; }
details { margin-top: 10px; font-size: 14px; }
summary { display: inline-flex; gap: 6px; align-items: center; color: var(--accent); font-weight: 600; cursor: pointer; list-style: none; }
summary::-webkit-details-marker { display: none; }
summary::before { content: ""; width: 6px; height: 6px; border: solid currentColor; border-width: 0 2px 2px 0; transform: rotate(-45deg); transition: transform 0.15s; }
details[open] summary::before { transform: rotate(45deg); }
summary small { color: var(--muted); font-weight: 400; }
.log { margin: 8px 0 0; padding: 10px 12px 10px 28px; border-radius: 12px; background: var(--pill); color: var(--text); display: block; list-style: disc; }
.log li { display: list-item; background: none; box-shadow: none; padding: 0; border-radius: 0; margin: 2px 0; }
footer { position: relative; text-align: center; color: var(--muted); font-size: 14px; padding: 8px 16px 48px; }
footer a { color: var(--accent); text-decoration: none; font-weight: 600; }
footer p { margin: 18px 0 8px; }
.btns { display: grid; grid-template-columns: repeat(auto-fit, 210px); gap: 8px; justify-content: center; }
@media (max-width: 679px) { .btns { grid-template-columns: 210px; } }
.btns a { padding: 9px 12px; border-radius: 12px; box-shadow: inset 0 0 0 1px var(--line); white-space: nowrap; }
.btns a.kofi { background: var(--kofi-bg); color: var(--kofi); }
.btns a.reddit { background: var(--reddit-bg); color: var(--reddit); }
.btns a.x { background: var(--x-bg); color: var(--x); }
.btns a.discord { background: var(--discord-bg); color: var(--discord); cursor: pointer; }
</style>
</head>
<body>
<canvas id="field" aria-hidden="true"></canvas>
<header class="hero"><div>
<img src="repo/CydiaIcon.png" alt="">
<h1>CySxL's Repo</h1>
<p class="tagline">Some coding practices, including original tweaks, rewritten and maintained forks.</p>
<div class="add">
<a href="sileo://source/https://cysxl.github.io/repo/">Add to Sileo</a>
<a class="ghost" href="zbra://sources/add/https://cysxl.github.io/repo/">Add to Zebra</a>
</div>
<span class="url" title="Copy">https://cysxl.github.io/repo/</span>
</div></header>
<main>
<div class="head"><h2>Packages</h2><span id="count"></span></div>
<ul id="list"></ul>
</main>
<footer>
<p>Enjoying these?</p>
<div class="btns"><a class="kofi" href="https://ko-fi.com/cysxl">Tip on Ko-fi</a></div>
<p>Contact</p>
<div class="btns"><a class="reddit" href="https://www.reddit.com/user/cysxl/">Reddit u/cysxl</a><a class="x" href="https://x.com/CySxL">X @CySxL</a><a class="discord" role="button">Discord @cydaidev16888</a></div>
</footer>
<script>
const url = document.querySelector('.url');
url.addEventListener('click', () => {
	if (!navigator.clipboard) return;
	navigator.clipboard.writeText('https://cysxl.github.io/repo/').then(() => {
		url.textContent = 'Copied';
		setTimeout(() => url.textContent = 'https://cysxl.github.io/repo/', 1200);
	}, () => {});
});
const updated = fetch('updated.json').then(r => r.ok ? r.json() : {}).catch(() => ({}));
const RECENT = 2 * 864e5;
const day = d => new Date(d + 'T00:00:00').toLocaleDateString('en', { month: 'short', day: 'numeric' });
// Only the section for the listed version, fetched the first time its card is opened.
function whatsNew(id, version, box) {
	fetch('changelogs/' + id + '.md').then(r => r.ok ? r.text() : Promise.reject()).then(md => {
		const parts = md.split(/^## /m).slice(1).map(s => s.split('\n'));
		const part = parts.find(s => s[0].trim() === version) || parts[0];
		const ul = document.createElement('ul');
		ul.className = 'log';
		for (const line of part.slice(1)) {
			const t = line.replace(/^\* /, '').trim();
			if (!t) continue;
			const li = document.createElement('li');
			li.textContent = t;
			ul.appendChild(li);
		}
		box.appendChild(ul);
	}).catch(() => box.remove());
}
const discord = document.querySelector('.discord');
discord.addEventListener('click', () => {
	if (!navigator.clipboard) return;
	navigator.clipboard.writeText('cydaidev16888').then(() => {
		discord.textContent = 'Copied';
		setTimeout(() => discord.textContent = 'Discord @cydaidev16888', 1200);
	}, () => {});
});
Promise.all([fetch('repo/Packages').then(r => r.text()), updated]).then(([text, dates]) => {
	const seen = new Map();
	for (const block of text.split(/\n\n+/)) {
		const f = {};
		for (const line of block.split('\n')) {
			const m = line.match(/^([A-Za-z-]+): (.*)$/);
			if (m) f[m[1]] = m[2];
		}
		if (!f.Package) continue;
		const arch = (f.Architecture || '').endsWith('arm64e') ? 'roothide' : 'rootless';
		const fw = (f.Depends || '').match(/firmware \(>= ([\d.]+)\)/);
		const item = seen.get(f.Package) || { id: f.Package, name: f.Name || f.Package, version: f.Version, desc: f.Description || '', icon: f.Icon || '', ios: fw ? fw[1].replace(/\.0$/, '') : '', archs: [] };
		item.archs.push(arch);
		seen.set(f.Package, item);
	}
	const items = [...seen.values()].sort((a, b) => a.name.localeCompare(b.name));
	document.getElementById('count').textContent = items.length + ' tweaks';
	const list = document.getElementById('list');
	items.forEach(p => {
		const li = document.createElement('li');
		li.innerHTML = '<img alt=""><section><div class="title"><b></b><span class="ver"></span></div><div class="desc"></div><div class="tags"></div></section>';
		const img = li.querySelector('img');
		if (p.icon) img.src = p.icon; else img.style.visibility = 'hidden';
		li.querySelector('b').textContent = p.name;
		li.querySelector('.ver').textContent = p.version;
		li.querySelector('.desc').textContent = p.desc;
		const tags = li.querySelector('.tags');
		p.archs.sort((a, b) => (a === 'rootless' ? 0 : 1) - (b === 'rootless' ? 0 : 1)).forEach(a => {
			const t = document.createElement('i');
			t.className = a;
			t.textContent = a;
			tags.appendChild(t);
		});
		if (p.ios) {
			const t = document.createElement('i');
			t.className = 'ios';
			t.textContent = 'iOS ' + p.ios + '+';
			tags.appendChild(t);
		}
		const date = dates[p.id];
		if (date && Date.now() - new Date(date + 'T00:00:00') < RECENT) {
			const n = document.createElement('span');
			n.className = 'new';
			n.textContent = 'Updated';
			li.querySelector('.title').appendChild(n);
		}
		const d = document.createElement('details');
		d.innerHTML = '<summary></summary>';
		d.firstChild.textContent = "What's new in " + p.version;
		if (date) {
			const s = document.createElement('small');
			s.textContent = day(date);
			d.firstChild.appendChild(s);
		}
		d.addEventListener('toggle', () => { if (d.open && !d.dataset.loaded) { d.dataset.loaded = 1; whatsNew(p.id, p.version, d); } });
		li.querySelector('section').appendChild(d);
		list.appendChild(li);
	});
});
</script>
<script>
(() => {
	const canvas = document.getElementById('field');
	const ctx = canvas.getContext('2d');
	const CELL = 18, SIZE = 14, FPS = 12, LOOP = 120, TAU = Math.PI * 2;
	// Every period divides LOOP, so the field is a pure function of time and repeats every two minutes.
	const BLOBS = [
		[0, 40, 60, 0.42, 0.38, 0.0], [1, 60, 40, 0.40, 0.42, 2.1], [2, 120, 30, 0.45, 0.36, 4.2],
		[0, 30, 120, 0.38, 0.44, 1.3], [1, 24, 60, 0.44, 0.40, 3.4], [2, 40, 24, 0.40, 0.38, 5.0],
	];
	const still = matchMedia('(prefers-reduced-motion: reduce)');
	const dark = matchMedia('(prefers-color-scheme: dark)');
	const grid = document.createElement('canvas');
	const ripples = [];
	let w = 0, h = 0, cols = 0, rows = 0, ox = 0, oy = 0, colors = [], raf = 0, last = 0;
	let value = new Float32Array(0), hue = new Uint8Array(0);

	const rect = (c, x, y, s) => {
		c.beginPath();
		c.roundRect ? c.roundRect(x - s / 2, y - s / 2, s, s, s * 0.28) : c.rect(x - s / 2, y - s / 2, s, s);
		c.fill();
	};

	function setup() {
		const dpr = Math.min(devicePixelRatio || 1, 2);
		w = innerWidth; h = innerHeight;
		for (const c of [canvas, grid]) { c.width = Math.round(w * dpr); c.height = Math.round(h * dpr); }
		ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
		cols = Math.ceil(w / CELL) + 1; rows = Math.ceil(h / CELL) + 1;
		ox = (w - (cols - 1) * CELL) / 2; oy = (h - (rows - 1) * CELL) / 2;
		value = new Float32Array(cols * rows); hue = new Uint8Array(cols * rows);
		const css = getComputedStyle(document.documentElement);
		colors = ['--dot1', '--dot2', '--dot3'].map(k => css.getPropertyValue(k).trim());
		const g = grid.getContext('2d');
		g.setTransform(dpr, 0, 0, dpr, 0, 0);
		g.clearRect(0, 0, w, h);
		g.fillStyle = css.getPropertyValue('--grid').trim();
		for (let j = 0; j < rows; j++) for (let i = 0; i < cols; i++) rect(g, ox + i * CELL, oy + j * CELL, SIZE * 0.3);
		draw(performance.now());
	}

	function draw(now) {
		const t = (now / 1000) % LOOP, r2 = (Math.hypot(w, h) * 0.13) ** 2;
		const bx = [], by = [];
		for (const [, px, py, ax, ay, ph] of BLOBS) {
			bx.push(w * (0.5 + ax * Math.sin(TAU * t / px + ph)));
			by.push(h * (0.5 + ay * Math.sin(TAU * t / py + ph * 1.7)));
		}
		const age = now / 1000;
		while (ripples.length && age - ripples[0][2] > 1.6) ripples.shift();
		for (let j = 0, n = 0; j < rows; j++) {
			const y = oy + j * CELL;
			for (let i = 0; i < cols; i++, n++) {
				const x = ox + i * CELL;
				let best = 0, c = 0;
				for (let k = 0; k < BLOBS.length; k++) {
					const f = 1 - ((x - bx[k]) ** 2 + (y - by[k]) ** 2) / r2;
					if (f > best) { best = f; c = BLOBS[k][0]; }
				}
				best *= best;
				for (const [rx, ry, rt, rc] of ripples) {
					const a = age - rt, d = Math.abs(Math.hypot(x - rx, y - ry) - a * 260);
					if (d < CELL * 1.2) {
						const f = (1 - d / (CELL * 1.2)) * (1 - a / 1.6) * 0.9;
						if (f > best) { best = f; c = rc; }
					}
				}
				value[n] = best; hue[n] = c;
			}
		}
		ctx.clearRect(0, 0, w, h);
		ctx.drawImage(grid, 0, 0, w, h);
		for (let k = 0; k < 3; k++) {
			ctx.fillStyle = colors[k];
			for (let j = 0, n = 0; j < rows; j++) for (let i = 0; i < cols; i++, n++) {
				const v = value[n];
				if (hue[n] !== k || v < 0.06) continue;
				ctx.globalAlpha = 0.2 + 0.55 * v;
				rect(ctx, ox + i * CELL, oy + j * CELL, SIZE * (0.35 + 0.65 * v));
			}
		}
		ctx.globalAlpha = 1;
	}

	function frame(now) {
		raf = requestAnimationFrame(frame);
		if (now - last < 1000 / FPS) return;
		last = now;
		draw(now);
	}
	function run() {
		cancelAnimationFrame(raf); raf = 0;
		if (!still.matches && !document.hidden) raf = requestAnimationFrame(frame);
	}

	let pending = 0;
	addEventListener('resize', () => {
		cancelAnimationFrame(pending);
		pending = requestAnimationFrame(setup);
	});
	addEventListener('pointerdown', e => {
		if (still.matches) return;
		ripples.push([e.clientX, e.clientY, performance.now() / 1000, ripples.length % 3]);
		if (ripples.length > 4) ripples.shift();
	}, { passive: true });
	document.addEventListener('visibilitychange', run);
	still.addEventListener('change', run);
	dark.addEventListener('change', setup);
	setup();
	run();
})();
</script>
</body>
</html>
